[project]
name = "climsmart-op-api"
version = "0.1.0"
description = "ClimSmart-OP API: weekly water-stress outlook for oil-palm locations (indicative, not validated)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "shapely>=2.0",
  "pyproj>=3.6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["climsmart*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 128
target-version = "py311"
extend-exclude = ["frontend", "public", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["B008", "UP017", "UP035", "UP045", "UP007", "B904"]

[tool.ruff.lint.per-file-ignores]
# v1 package is kept byte-compatible; it is linted for real errors only (no style rewrites).
"climsmart/**" = ["E501", "E731", "E402", "F401", "F541", "B", "UP", "I", "W"]
"api/index.py" = ["E402", "I"]
"migrations/**" = ["E501", "I", "UP", "W291"]
